services:
  db:
    image: postgres:latest
    container_name: postgres-container
    restart: always
    environment:
        POSTGRES_USER: app_user
        POSTGRES_PASSWORD: app_password
        POSTGRES_DB: app_db
    ports:
      - "5433:5432"
    networks:
      - app-networks
    volumes:
      - pg_data:/var/lib/postgresql/data
    # healthcheck:
    #   test: ["CMD", "pg_isready", "-U", "app_user"]
    #   interval: 5s
    #   retries: 5

  app:
    build: .
    container_name: fastapi-container
    restart: on-failure 
    depends_on:
      - db
    ports:
      - "8000:8000"
    networks:
      - app-networks
    env_file:
      - .env


networks:
  app-networks:

volumes:
  pg_data:
